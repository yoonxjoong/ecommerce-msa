spring:
  application:
    name: reconciliation-batch
  main:
    web-application-type: none
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/inventory_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

reconciliation:
  fixed-delay-ms: 5000

logging:
  level:
    com.example.reconciliation: DEBUG
