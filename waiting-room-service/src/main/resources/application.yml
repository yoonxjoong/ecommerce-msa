server:
  port: 8091

spring:
  application:
    name: waiting-room-service
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: 6379

waiting-room:
  admission:
    batch-size: 2         # 한 번에 입장시킬 인원
    interval-ms: 3000      # 입장 스케줄러 실행 주기
  token-ttl-seconds: 300   # 입장 토큰 유효 시간 (5분 안에 결제까지 끝내야 함)

logging:
  level:
    com.example.waitingroom: DEBUG
