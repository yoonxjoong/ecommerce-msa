server:
  port: 8080

spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/order_db
    username: postgres
    password: postgres
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: order-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer

payment:
  topic: payment-events

order:
  topic: order-events
  pending-timeout-seconds: 30      # 이 시간 넘게 PENDING이면 payment-events가 끝내 안 온 것으로 보고 강제 취소
  pending-sweep-interval-ms: 10000 # 위 타임아웃 주문을 몇 ms마다 훑을지

clients:
  inventory-service:
    base-url: ${INVENTORY_SERVICE_URL:http://localhost:8081}
  payment-service:
    base-url: ${PAYMENT_SERVICE_URL:http://localhost:8082}
  waiting-room-service:
    base-url: ${WAITING_ROOM_SERVICE_URL:http://localhost:8091}

resilience4j:
  circuitbreaker:
    instances:
      paymentService:
        sliding-window-type: COUNT_BASED
        sliding-window-size: 5        # 최근 5번의 호출을 기준으로 판단
        minimum-number-of-calls: 5    # 최소 5번은 쌓여야 판단 시작
        failure-rate-threshold: 50    # 그중 50% 이상 실패하면 OPEN
        wait-duration-in-open-state: 10s   # OPEN 상태 유지 시간
        permitted-number-of-calls-in-half-open-state: 2  # HALF_OPEN에서 시험 호출 횟수
        automatic-transition-from-open-to-half-open-enabled: true
  bulkhead:
    instances:
      paymentService:
        max-concurrent-calls: 10   # payment-service 호출은 동시에 10건까지만 - 나머지는 즉시 거부
        max-wait-duration: 0       # 슬롯이 찰 때까지 대기하지 않고 바로 BulkheadFullException

logging:
  level:
    com.example.order: DEBUG
